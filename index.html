<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FF2D55">
    <title>GiftTracker Pro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Splash Screen -->
        <div id="splash" class="splash-screen">
            <div class="splash-content">
                <div class="splash-logo">
                    <svg width="120" height="120" viewBox="0 0 120 120" fill="none">
                        <rect width="120" height="120" rx="28" fill="url(#gradient)"/>
                        <path d="M60 30C60 30 40 30 40 50C40 60 50 65 60 75C70 65 80 60 80 50C80 30 60 30 60 30Z" fill="white" opacity="0.9"/>
                        <rect x="55" y="25" width="10" height="15" rx="5" fill="white" opacity="0.9"/>
                        <circle cx="60" cy="55" r="8" fill="white" opacity="0.6"/>
                        <defs>
                            <linearGradient id="gradient" x1="0" y1="0" x2="120" y2="120">
                                <stop offset="0%" stop-color="#FF2D55"/>
                                <stop offset="100%" stop-color="#FF6B8A"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1 class="splash-title">GiftTracker</h1>
                <p class="splash-subtitle">Никогда не забывайте о подарках</p>
                <div class="splash-loader">
                    <div class="splash-loader-bar"></div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div id="main-content" class="hidden">
            <!-- Status Bar -->
            <div class="status-bar">
                <span class="status-time">9:41</span>
                <div class="status-icons">
                    <span>📶</span>
                    <span>🔋</span>
                </div>
            </div>

            <!-- Navigation Bar -->
            <div class="nav-bar" id="nav-bar">
                <button class="nav-back hidden" id="nav-back">← Назад</button>
                <h1 class="nav-title" id="nav-title">GiftTracker</h1>
                <button class="nav-action" id="nav-action">+</button>
            </div>

            <!-- Content Area -->
            <div class="content-area" id="content-area">
                <!-- Content injected by JS -->
            </div>

            <!-- Tab Bar -->
            <div class="tab-bar" id="tab-bar">
                <button class="tab-item active" data-tab="home">
                    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <span class="tab-label">Главная</span>
                </button>
                <button class="tab-item" data-tab="people">
                    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 00-3-3.87"/>
                        <path d="M16 3.13a4 4 0 010 7.75"/>
                    </svg>
                    <span class="tab-label">Люди</span>
                </button>
                <button class="tab-item" data-tab="events">
                    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <span class="tab-label">События</span>
                </button>
                <button class="tab-item" data-tab="stats">
                    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="20" x2="18" y2="10"/>
                        <line x1="12" y1="20" x2="12" y2="4"/>
                        <line x1="6" y1="20" x2="6" y2="14"/>
                    </svg>
                    <span class="tab-label">Статистика</span>
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
